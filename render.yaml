services:
  - type: web
    name: docuforge-api
    env: python
    buildCommand: pip install -r requirements.txt && python seed.py
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATABASE_URL
        value: sqlite:///./app.db
      - key: SECRET_KEY
        generateValue: true
      - key: DOMAIN
        fromService:
          type: web
          name: docuforge-api
          property: url
