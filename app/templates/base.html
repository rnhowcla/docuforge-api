<!DOCTYPE html>
<html lang="en">
<head>

    <title>{% block title %}DocuForge API{% endblock %}</title>
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>

        <div class="container">
            <a href="/" class="brand">DocuForge API</a>

                <a href="/pricing">Pricing</a>

    <footer>

            <p>&copy; 2026 DocuForge API. Built for developers.</p>
        </div>
    </footer>
